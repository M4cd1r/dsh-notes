# Publish @m4cd1r/dsh-notes to npm via Trusted Publishing (OIDC) — no NPM_TOKEN.
#
# npmjs.com trusts this exact repo + workflow file (configured as the package's
# Trusted Publisher: owner M4cd1r, repo dsh-notes, workflow release.yml).
# The npm CLI exchanges the GitHub OIDC token automatically (npm >= 11.5.1).
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Use npm with OIDC trusted publishing
        run: npm install --global npm@latest

      - name: Install dependencies (no lifecycle scripts)
        run: npm install --ignore-scripts

      - name: Verify (syntax + unit tests + smoke)
        run: npm run verify

      - name: Publish to npm (Trusted Publishing / OIDC — no token)
        run: npm publish --access public --provenance

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "GitHub release ${GITHUB_REF_NAME} already exists"
          else
            gh release create "${GITHUB_REF_NAME}" --generate-notes
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
